[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "cad-scale-dxf"
version = "0.1.0"
description = "Zero-dependency Python library for 2D CAD and DXF geometry: polyline length, shoelace polygon area, DPI-to-mm scale calibration, Ramer-Douglas-Peucker simplification, and ASCII DXF export."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "VisualCraft Lab" }]
keywords = ["cad", "dxf", "geometry", "polyline", "vector"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://imgtocad.com/"
Documentation = "https://imgtocad.com/sketch-to-cad"
Repository = "https://github.com/visualcraft-lab/dxf-geometry-py"

[tool.hatch.build.targets.wheel]
packages = ["src/dxf_geometry"]
